<div class=status-bar>
  <div class=status-left>
    <button id=btnShowProbabilityTop class=top-bar-btn title="Show probability distribution">
      <i class="icon trophy"></i>
      <span data-trans>Prob</span>
    </button>
    <button id=btnSettings class=top-bar-btn title="Game settings">
      <i class="gear icon"></i>
      <span data-trans>Settings</span>
    </button>
  </div>

  <div class=status-center>
    <div class=control-group>
      <button id=btnSlowDownTop class=top-bar-btn title="Slow down ball movement">
        <i class="fast-rewind icon"></i>
      </button>
      <span id=speedFactorDisplay class=top-bar-speed-display title="Current speed factor">
        1.0x
      </span>
      <button id=btnResetSpeedTop class=top-bar-btn title="Reset speed to 1.0x">
        <i class="icon redo"></i>
      </button>
      <button id=btnSpeedUpTop class=top-bar-btn title="Speed up ball movement">
        <i class="fast-forward icon"></i>
      </button>
    </div>

    <div class=control-group>
      <button id=btnStart class=top-bar-btn title="Start game">
        <i class="icon play"></i>
        <span data-trans>Play</span>
      </button>
      <button id=btnFreezeTop class=top-bar-btn title="Freeze/unfreeze ball movement">
        <i class="icon timer-pause"></i>
        <span data-trans>Freeze</span>
      </button>
      <button id=btnShakeAllTop class=top-bar-btn title="Shake all balls to add randomness">
        <i class="earthquake icon"></i>
        <span data-trans>Shake</span>
      </button>
    </div>
  </div>

  <div class=status-right>
    <button id=btnResetGameTop class=top-bar-btn title="Reset the entire game">
      <i class="icon replay"></i>
      <span data-trans>Reset</span>
    </button>
  </div>
</div>


<div id=settings class=settings>
  <div class=right>
    <div class=row>
      <label for=sltMap>
        <i class="icon map"></i>
        <span data-trans>Map</span>
      </label>
      <select id=sltMap></select>
    </div>
    <div class=row>
      <label for=chkAutoRecording>
        <i class="icon record"></i>
        <span data-trans>Recording</span>
      </label>
      <input type=checkbox id=chkAutoRecording>
    </div>
    <div class=row>
      <label>
        <i class="icon trophy"></i>
        <span data-trans>The winner is</span>
      </label>
      <div class=btn-group>
        <button class="btn-first-winner btn-winner" data-trans>First</button>
        <button class="active btn-last-winner btn-winner" data-trans>Last</button>
        <input type=number id=in_winningRank value=1 min=1>
      </div>
    </div>
    <div class=row>
      <label for=chkSkill>
        <i class="bomb icon"></i>
        <span data-trans>Using skills</span>
      </label>
      <input type=checkbox id=chkSkill checked>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>짱구*5, 짱아*10, 봉미선*3</textarea>
    <div class=actions>
      <div class=download-dropdown id=downloadDropdown>
        <button id=btnDownload>
          <i class="download icon"></i>
          <span data-trans>Download</span>
        </button>
        <div class=dropdown-content>
          <button id=btnDownloadTxt>.txt</button>
          <button id=btnDownloadCsv>.csv</button>
          <button id=btnDownloadXls>.xlsx</button>
        </div>
      </div>
      <div class=sep></div>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStartBottom>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>


<div id=inGame>
  <button id=btnShake data-trans>Shake!</button>
</div>


<div class=main-map-zoom-controls>
  <button id=mainMapZoomIn class=main-map-zoom-btn title="Zoom in main map (Alt + +)">
    +
  </button>
  <button id=mainMapZoomOut class=main-map-zoom-btn title="Zoom out main map (Alt + -)">
    -
  </button>
</div>


<div id=probabilityDisplay></div>


<div id=gameResultDisplay></div>


<div id=settingsPanel class=side-panel>
  <div class=panel-header>
    <h3 data-trans>Settings</h3>
    <button id=btnCloseSettings class=close-btn>×</button>
  </div>
  <div class=panel-content>
    <div class=settings-section>
      <h4 data-trans>Display Settings</h4>
      <div class="setting-item toggle-item">
        <label for=showProbabilityDefault>
          <span data-trans>Show Probability per Option:</span>
          <input type=checkbox id=showProbabilityDefault>
        </label>
      </div>
      <div class=setting-item>
        <label data-trans>Minimap Zoom</label>
        <div class=minimap-zoom-controls-settings>
          <button id=settingsMinimapZoomOut class="control-btn small" title="Zoom out minimap">−</button>
          <span class=minimap-zoom-display>1.0x</span>
          <button id=settingsMinimapZoomIn class="control-btn small" title="Zoom in minimap">+</button>
        </div>
      </div>
    </div>

    <div class=settings-section>
      <h4 data-trans>Game Settings</h4>
      <div class=setting-item>
        <label for=settingsMap data-trans>Map:</label>
        <select id=settingsMap></select>
      </div>
      <div class="setting-item toggle-item">
        <label for=settingsAutoRecording>
          <span data-trans>Auto Recording:</span>
          <input type=checkbox id=settingsAutoRecording>
        </label>
      </div>
      <div class=setting-item>
        <label data-trans>Winner Selection:</label>
        <div class=winner-buttons>
          <button id=settingsFirstWinner class=winner-btn data-trans>First</button>
          <button id=settingsLastWinner class="active winner-btn" data-trans>Last</button>
          <input type=number id=settingsWinningRank value=1 min=1>
        </div>
      </div>
    </div>

    <div class=settings-section>
      <h4 data-trans>Skill Settings</h4>
      <div class="setting-item toggle-item">
        <label for=settingsEnableSkills>
          <span data-trans>Enable Skills:</span>
          <input type=checkbox id=settingsEnableSkills checked>
        </label>
      </div>
      <div class="range-item setting-item">
        <label for=settingsSkillCooldown>
          <span data-trans>Skill Cooldown Time (seconds):</span>
          <span id=settingsSkillCooldownValue>5</span>
        </label>
        <input type=range id=settingsSkillCooldown min=1 max=30 step=1 value=5>
      </div>
      <div class="range-item setting-item">
        <label for=settingsSkillProbability>
          <span data-trans>Skill Probability (%):</span>
          <span id=settingsSkillProbabilityValue>20</span>
        </label>
        <input type=range id=settingsSkillProbability min=0 max=100 step=1 value=20>
      </div>
    </div>
  </div>
</div>
