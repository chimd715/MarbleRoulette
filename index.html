function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map((v)=>v.trim()).filter((v)=>!!v);
}
function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
        name,
        weight,
        count
    };
}
function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('mbr_names', names.join(','));
    // Update participant count
    updateParticipantCount();
    // Only show probability display if setting is enabled
    const showProbabilityDefault = localStorage.getItem('showProbabilityDefault') === 'true';
    if (showProbabilityDefault) updateProbabilityDisplay();
    switch(winnerType){
        case 'first':
            setWinnerRank(1);
            break;
        case 'last':
            const total = window.roulette.getCount();
            setWinnerRank(total);
            break;
        case 'custom':
            // Keep the current custom rank, just re-apply it
            const currentRank = parseInt(document.querySelector('#in_winningRank').value, 10);
            if (!isNaN(currentRank) && currentRank > 0) setWinnerRank(currentRank);
            break;
    }
}
function updateParticipantCount() {
    const names = getNames();
    let totalCount = 0;
    names.forEach((nameStr)=>{
        const parsed = parseName(nameStr);
        totalCount += parsed.count;
    });
    const countEl = document.querySelector('.participant-count');
    if (countEl) countEl.textContent = totalCount;
}
function calculateProbabilities() {
    const names = getNames();
    if (names.length === 0) return [];
    const members = names.map((nameString)=>{
        const result = parseName(nameString);
        if (!result || !result.name) return null;
        return result;
    }).filter((member)=>!!member);
    if (members.length === 0) return [];
    let maxWeight = -Infinity;
    let minWeight = Infinity;
    members.forEach((member)=>{
        if (member) {
            if (member.weight > maxWeight) maxWeight = member.weight;
            if (member.weight < minWeight) minWeight = member.weight;
        }
    });
    const gap = maxWeight - minWeight;
    let totalCount = 0;
    let totalWeightedCount = 0;
    const processedMembers = members.map((member)=>{
        if (!member) return null;
        const normalizedWeight = 0.1 + (gap ? (member.weight - minWeight) / gap : 0);
        const weightedCount = member.count * normalizedWeight;
        totalCount += member.count;
        totalWeightedCount += weightedCount;
        return {
            ...member,
            normalizedWeight,
            weightedCount
        };
    }).filter((member)=>!!member);
    if (totalWeightedCount === 0) return processedMembers.map((member)=>{
        if (!member) return null;
        const probability = member.count / totalCount * 100;
        return {
            name: member.name,
            count: member.count,
            weight: member.weight,
            normalizedWeight: member.normalizedWeight,
            probability: probability
        };
    }).filter((member)=>!!member);
    return processedMembers.map((member)=>{
        if (!member) return null;
        const probability = member.weightedCount / totalWeightedCount * 100;
        return {
            name: member.name,
            count: member.count,
            weight: member.weight,
            normalizedWeight: member.normalizedWeight,
            probability: probability
        };
    }).filter((member)=>!!member);
}
function updateProbabilityDisplay() {
    const probabilities = calculateProbabilities();
    const container = document.getElementById('probabilityDisplay');
    if (!container) return;
    if (probabilities.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        return;
    }
    const sortedProbabilities = probabilities.sort((a, b)=>{
        if (!a || !b) return 0;
        return b.probability - a.probability;
    });
    const totalCount = sortedProbabilities.reduce((sum, item)=>sum + (item?.count || 0), 0);
    let html = `<div class="probability-header"><h3 data-trans>Probability per Option</h3><button id="btnHideProbability" class="hide-btn">\xd7</button></div>`;
    html += '<div class="probability-list">';
    sortedProbabilities.forEach((item, index)=>{
        if (!item) return;
        const weightText = item.weight > 1 ? ` (weight: ${item.weight})` : '';
        const countText = item.count > 1 ? ` \xd7${item.count}` : '';
        const rankText = index === 0 ? " \uD83E\uDD47" : index === 1 ? " \uD83E\uDD48" : index === 2 ? " \uD83E\uDD49" : '';
        html += `
        <div class="probability-item">
          <div class="probability-name">${item.name}${weightText}${countText}${rankText}</div>
          <div class="probability-bar">
            <div class="probability-fill" style="width: ${item.probability}%"></div>
          </div>
          <div class="probability-value">${item.probability.toFixed(1)}%</div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
    container.style.display = 'block';
    // Apply translation to dynamically generated elements
    const titleElement = container.querySelector('h3[data-trans]');
    if (titleElement && window.translateElement) window.translateElement(titleElement);
}
function showGameResult() {
    const container = document.getElementById('gameResultDisplay');
    if (!window.roulette || !window.roulette._winners) {
        container.style.display = 'none';
        return;
    }
    const winners = window.roulette._winners;

            </div>
          </div>
          <button id="btnHideResult" class="hide-btn">\xd7</button>
        </div>
      </div>`;

function setWinnerRank(rank) {
    // Update both #settings panel and side panel
    const inWinningRank = document.querySelector('#in_winningRank');
    const settingsWinningRank = document.querySelector('#settingsWinningRank');
    if (inWinningRank) inWinningRank.value = rank;
    if (settingsWinningRank) settingsWinningRank.value = rank;
    window.options.winningRank = rank - 1;
    window.roulette.setWinningRank(window.options.winningRank);
    // Update #settings panel buttons
    const btnFirst = document.querySelector('.btn-first-winner');
    const btnLast = document.querySelector('.btn-last-winner');
    if (winnerType === 'first') {
        if (btnFirst) btnFirst.classList.add('active');
        if (btnLast) btnLast.classList.remove('active');
        if (inWinningRank) inWinningRank.classList.remove('active');
    } else if (winnerType === 'last') {
        if (btnFirst) btnFirst.classList.remove('active');
        if (btnLast) btnLast.classList.add('active');
        if (inWinningRank) inWinningRank.classList.remove('active');
    } else if (winnerType === 'custom') {
        if (btnFirst) btnFirst.classList.remove('active');
        if (btnLast) btnLast.classList.remove('active');
        if (inWinningRank) inWinningRank.classList.add('active');
    }
    // Update side panel buttons
    const settingsFirst = document.querySelector('#settingsFirstWinner');
    const settingsLast = document.querySelector('#settingsLastWinner');
    if (winnerType === 'first') {
        if (settingsFirst) settingsFirst.classList.add('active');
        if (settingsLast) settingsLast.classList.remove('active');
        if (settingsWinningRank) settingsWinningRank.classList.remove('active');
    } else if (winnerType === 'last') {
        if (settingsFirst) settingsFirst.classList.remove('active');
        if (settingsLast) settingsLast.classList.add('active');
        if (settingsWinningRank) settingsWinningRank.classList.remove('active');
    } else if (winnerType === 'custom') {
        if (settingsFirst) settingsFirst.classList.remove('active');

    const speedFactorDisplay = document.getElementById('speedFactorDisplay');
    const speedDisplay = document.querySelector('.speed-display');
    if (speedUpBtn) speedUpBtn.disabled = currentSpeed >= 2.5;
    if (slowDownBtn) slowDownBtn.disabled = currentSpeed <= 0.1;
    if (speedFactorDisplay) speedFactorDisplay.textContent = `${currentSpeed.toFixed(1)}x`;
    if (speedDisplay) {
        const zoomIndicator = window.roulette && window.roulette.isManualZoomMode ? window.roulette.isManualZoomMode() ? ' (Manual)' : ' (Auto)' : '';
        speedDisplay.textContent = `Speed: ${currentSpeed.toFixed(1)}x | Zoom: ${currentZoom.toFixed(1)}x${zoomIndicator}`;
    }
}
function updateZoomDisplay() {
    const zoomInBtn = document.querySelector('#mainMapZoomIn');
    const zoomOutBtn = document.querySelector('#mainMapZoomOut');
    const speedDisplay = document.querySelector('.speed-display');
    if (zoomInBtn) zoomInBtn.disabled = currentZoom >= 5;
    if (zoomOutBtn) zoomOutBtn.disabled = currentZoom <= 0.1;
    if (speedDisplay) {
        const zoomIndicator = window.roulette && window.roulette.isManualZoomMode ? window.roulette.isManualZoomMode() ? ' (Manual)' : ' (Auto)' : '';
        speedDisplay.textContent = `Speed: ${currentSpeed.toFixed(1)}x | Zoom: ${currentZoom.toFixed(1)}x${zoomIndicator}`;
    }
}
function updateMinimapZoomDisplay() {
    if (!window.roulette) return;
    const currentMinimapZoom = window.roulette.getMinimapZoom ? window.roulette.getMinimapZoom() : 1;
    const zoomInBtn = document.querySelector('#settingsMinimapZoomIn');
    const zoomOutBtn = document.querySelector('#settingsMinimapZoomOut');
    const zoomDisplay = document.querySelector('.minimap-zoom-display');
    if (zoomInBtn) zoomInBtn.disabled = currentMinimapZoom >= 3;
    if (zoomOutBtn) zoomOutBtn.disabled = currentMinimapZoom <= 0.5;
    if (zoomDisplay) zoomDisplay.textContent = `${currentMinimapZoom.toFixed(1)}x`;
}
let ready = false;
let winnerType = 'last';
let isFrozen = false;
let currentSpeed = 1;
let currentZoom = 1.0;
let lastZoomChange = 0;
document.addEventListener('DOMContentLoaded', initialize);
function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
        setTimeout(initialize, 100);
        return;
    }
    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');
    if (namesFromUrl) document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    else {
        const savedNames = localStorage.getItem('mbr_names');
        if (savedNames) document.querySelector('#in_names').value = savedNames;
    }
    // Input section event listeners
    document.querySelector('#in_names').addEventListener('input', ()=>{
        getReady();
    });
    document.querySelector('#in_names').addEventListener('blur', ()=>{
        const nameSource = getNames();
        const nameSet = new Set();
        const nameCounts = {};
        nameSource.forEach((nameSrc)=>{
            const name = parseName(nameSrc);
            const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
            if (!nameSet.has(key)) {
                nameSet.add(key);
                nameCounts[key] = 0;
            }
            nameCounts[key] += name.count;
        });
        const result = [];
        Object.keys(nameCounts).forEach((key)=>{
            if (nameCounts[key] > 1) result.push(`${key}*${nameCounts[key]}`);
            else result.push(key);
        });
        const oldValue = document.querySelector('#in_names').value;
        const newValue = result.join(',');
        if (oldValue !== newValue) {
            document.querySelector('#in_names').value = newValue;
            getReady();
        }
    });
    // Top bar button controls
    document.querySelector('#btnShowProbabilityTop').addEventListener('click', ()=>{
        const probabilityDisplay = document.getElementById('probabilityDisplay');
        if (probabilityDisplay.style.display === 'block') probabilityDisplay.style.display = 'none';
        else updateProbabilityDisplay();
    });
    document.querySelector('#btnSettings').addEventListener('click', ()=>{
        document.getElementById('settingsPanel').classList.add('open');
    });
    document.querySelector('#btnSlowDownTop').addEventListener('click', ()=>{
        if (window.roulette) {
            currentSpeed = Math.max(currentSpeed - 0.1, 0.1);
            if (window.roulette.setSpeed) window.roulette.setSpeed(currentSpeed);
            updateSpeedButtons();
        }
    });
    document.querySelector('#btnSpeedUpTop').addEventListener('click', ()=>{
        if (window.roulette) {
            currentSpeed = Math.min(currentSpeed + 0.1, 2.5);
            if (window.roulette.setSpeed) window.roulette.setSpeed(currentSpeed);
            updateSpeedButtons();
        }
    });
    document.querySelector('#btnResetSpeedTop').addEventListener('click', ()=>{
        if (window.roulette) {
            currentSpeed = 1;
            if (window.roulette.setSpeed) window.roulette.setSpeed(currentSpeed);
            updateSpeedButtons();
        }
    });
    // Start game function (shared by top bar and bottom panel)
    function startGame() {
        // If game ended and not reset, auto-reset before starting
        if (!ready) {
            getReady();
            if (!ready) return; // Still not ready (e.g., no names entered)
        }
        gtag && gtag('event', 'start', {
            'event_category': 'roulette',
            'event_label': 'start',
            'value': window.roulette.getCount()
        });
        // Disable manual zoom mode when game starts
        if (window.roulette && window.roulette.resetZoom) {
            window.roulette.resetZoom();
            currentZoom = 1.0;
            updateZoomDisplay();
        }
        // Turn off freeze when starting
        if (isFrozen) {
            isFrozen = false;
            const freezeBtn = document.querySelector('#btnFreezeTop');
            if (freezeBtn) freezeBtn.classList.remove('active');
            if (window.roulette && window.roulette.setFrozen) window.roulette.setFrozen(false);
        }
        window.roulette.start();
        document.querySelector('#settings').classList.add('hide');
        document.getElementById('probabilityDisplay').style.display = 'none';
        document.getElementById('gameResultDisplay').style.display = 'none';
    }
    // Top bar Start button
    document.querySelector('#btnStart').addEventListener('click', startGame);
    // Bottom panel Start button
    document.querySelector('#btnStartBottom').addEventListener('click', startGame);
    document.querySelector('#btnFreezeTop').addEventListener('click', ()=>{
        if (window.roulette) {
            isFrozen = !isFrozen;
            const button = document.querySelector('#btnFreezeTop');
            button.classList.toggle('active', isFrozen);
            if (window.roulette.setFrozen) window.roulette.setFrozen(isFrozen);
        }
    });
    document.querySelector('#btnShakeAllTop').addEventListener('click', ()=>{
        if (window.roulette && ready) {
            const marbles = window.roulette.getMarbles ? window.roulette.getMarbles() : [];
            marbles.forEach((marble)=>{
                if (window.roulette.shakeMarble) window.roulette.shakeMarble(marble.id);
            });
        }
    });
    document.querySelector('#btnResetGameTop').addEventListener('click', ()=>{
        // Reset game state
        if (window.roulette && window.roulette.reset) window.roulette.reset();
        // Reset zoom
        if (window.roulette && window.roulette.resetZoom) {
            window.roulette.resetZoom();
            currentZoom = 1.0;
            updateZoomDisplay();
        }
        // Reset freeze state
        if (isFrozen) {
            isFrozen = false;
            const freezeBtn = document.querySelector('#btnFreezeTop');
            if (freezeBtn) freezeBtn.classList.remove('active');
            if (window.roulette && window.roulette.setFrozen) window.roulette.setFrozen(false);
        }
        // Reload marbles and show settings panel
        getReady();
        document.querySelector('#settings').classList.remove('hide');
        // Show probability panel if setting is enabled
        const showProbabilityDefault = localStorage.getItem('showProbabilityDefault') === 'true';
        if (showProbabilityDefault) updateProbabilityDisplay();
    });
    // Close settings button
    document.getElementById('btnCloseSettings').addEventListener('click', function() {
        document.getElementById('settingsPanel').classList.remove('open');
    });
    // Close settings when clicking outside
    document.addEventListener('click', function(e) {
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsBtn = document.getElementById('btnSettings');
        if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target) && !settingsBtn.contains(e.target)) settingsPanel.classList.remove('open');
    });
    // Shuffle button
    document.querySelector('#btnShuffle').addEventListener('click', ()=>{
        document.getElementById('gameResultDisplay').style.display = 'none';
        getReady();
    });
    // Quick settings event listeners (in #settings panel)
    document.querySelector('#chkAutoRecording').addEventListener('change', (e)=>{
        window.options.autoRecording = e.target.matches(':checked');
        window.roulette.setAutoRecording(window.options.autoRecording);
    });
    document.querySelector('#chkSkill').addEventListener('change', (e)=>{
        window.options.useSkills = e.target.matches(':checked');
    });
    document.querySelector('#in_winningRank').addEventListener('change', (e)=>{
        const v = parseInt(e.target.value, 10);
        winnerType = 'custom';
        setWinnerRank(isNaN(v) ? 0 : v);
    });
    document.querySelector('.btn-last-winner').addEventListener('click', ()=>{
        const total = window.roulette.getCount();
        winnerType = 'last';
        setWinnerRank(total);
    });
    document.querySelector('.btn-first-winner').addEventListener('click', ()=>{
        winnerType = 'first';
        setWinnerRank(1);
    });
    // Initialize map selectors in both #settings and side-panel
    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    const settingsMapSelector = document.querySelector('#settingsMap');
    maps.forEach((map)=>{
        // Add to bottom settings map selector
        const option1 = document.createElement('option');
        option1.value = map.index;
        option1.innerHTML = map.title;
        option1.setAttribute('data-trans', '');
        window.translateElement(option1);
        mapSelector.append(option1);
        // Add to side-panel settings map selector
        const option2 = document.createElement('option');
        option2.value = map.index;
        option2.innerHTML = map.title;
        option2.setAttribute('data-trans', '');
        window.translateElement(option2);
        settingsMapSelector.append(option2);
    });
    // Sync map selectors
    function syncMapSelectors(value) {
        mapSelector.value = value;
        settingsMapSelector.value = value;
        window.roulette.setMap(value);
    }
    mapSelector.addEventListener('change', (e)=>{
        syncMapSelectors(e.target.value);
    });
    settingsMapSelector.addEventListener('change', (e)=>{
        syncMapSelectors(e.target.value);
    });
    // Game events
    window.roulette.addEventListener('goal', ()=>{
        ready = false;
        setTimeout(()=>{
            document.querySelector('#settings').classList.remove('hide');
            // Show game result panel when game ends
            showGameResult();
        }, 3000);
    });
    window.roulette.addEventListener('message', (e)=>{
        simpleToast(e.detail);
    });
    // Initialize shuffle
    document.querySelector('#btnShuffle').click();
    // Main map zoom controls
    document.querySelector('#mainMapZoomIn').addEventListener('click', ()=>{
        if (window.roulette && window.roulette.setZoom) {
            const now = Date.now();
            if (now - lastZoomChange < 100) return;
            lastZoomChange = now;
            currentZoom = Math.min(currentZoom * 1.5, 5);
            window.roulette.setZoom(currentZoom * 30);
            updateZoomDisplay();
        }
    });
    document.querySelector('#mainMapZoomOut').addEventListener('click', ()=>{
        if (window.roulette && window.roulette.setZoom) {
            const now = Date.now();
            if (now - lastZoomChange < 100) return;
            lastZoomChange = now;
            currentZoom = Math.max(currentZoom / 1.5, 0.2);
            window.roulette.setZoom(currentZoom * 30);
            updateZoomDisplay();
        }
    });
    // Settings panel controls
    document.getElementById('showProbabilityDefault').addEventListener('change', function() {
        const showProbability = this.checked;
        localStorage.setItem('showProbabilityDefault', showProbability);
        if (showProbability) updateProbabilityDisplay();
        else document.getElementById('probabilityDisplay').style.display = 'none';
    });
    document.getElementById('settingsAutoRecording').addEventListener('change', function() {
        window.options.autoRecording = this.checked;
        window.roulette.setAutoRecording(window.options.autoRecording);
    });
    document.getElementById('settingsFirstWinner').addEventListener('click', function() {
        winnerType = 'first';
        setWinnerRank(1);
    });
    document.getElementById('settingsLastWinner').addEventListener('click', function() {
        const total = window.roulette.getCount();
        winnerType = 'last';
        setWinnerRank(total);
    });
    document.getElementById('settingsWinningRank').addEventListener('change', function() {
        const v = parseInt(this.value, 10);
        winnerType = 'custom';
        setWinnerRank(isNaN(v) ? 1 : v);
    });
    document.getElementById('settingsEnableSkills').addEventListener('change', function() {
        window.options.useSkills = this.checked;
        // Also sync with #chkSkill checkbox
        const chkSkill = document.querySelector('#chkSkill');
        if (chkSkill) chkSkill.checked = this.checked;
    });
    document.getElementById('settingsSkillCooldown').addEventListener('input', function() {
        const cooldown = this.value;
        document.getElementById('settingsSkillCooldownValue').textContent = cooldown;
        if (window.roulette && window.roulette.setSkillCooldown) window.roulette.setSkillCooldown(cooldown * 1000);
    });
    document.getElementById('settingsSkillProbability').addEventListener('input', function() {
        const probability = this.value;
        document.getElementById('settingsSkillProbabilityValue').textContent = probability;
        if (window.roulette && window.roulette.setSkillProbability) window.roulette.setSkillProbability(probability / 100);
    });
    // Minimap zoom controls
    document.querySelector('#settingsMinimapZoomIn').addEventListener('click', ()=>{
        if (window.roulette && window.roulette.setMinimapZoom) {
            const currentMinimapZoom = window.roulette.getMinimapZoom();
            const newZoom = Math.min(currentMinimapZoom * 1.5, 3);
            window.roulette.setMinimapZoom(newZoom);
            updateMinimapZoomDisplay();
        }
    });
    document.querySelector('#settingsMinimapZoomOut').addEventListener('click', ()=>{
        if (window.roulette && window.roulette.setMinimapZoom) {
            const currentMinimapZoom = window.roulette.getMinimapZoom();
            const newZoom = Math.max(currentMinimapZoom / 1.5, 0.5);
            window.roulette.setMinimapZoom(newZoom);
            updateMinimapZoomDisplay();
        }
    });
    // Hide probability button (delegated)
    document.addEventListener('click', (e)=>{
        if (e.target && e.target.id === 'btnHideProbability') {
            const container = document.getElementById('probabilityDisplay');
            if (container) container.style.display = 'none';
        }
    });
    // Keyboard shortcuts for zoom
    document.addEventListener('keydown', (e)=>{
        if (e.altKey) switch(e.key){
            case '=':
            case '+':
                e.preventDefault();
                document.querySelector('#mainMapZoomIn').click();
                break;
            case '-':
                e.preventDefault();
                document.querySelector('#mainMapZoomOut').click();
                break;
        }
    });
    // Load settings from localStorage
    const showProbabilityDefault = localStorage.getItem('showProbabilityDefault') === 'true';
    document.getElementById('showProbabilityDefault').checked = showProbabilityDefault;
    // Initialize
    document.querySelector('#btnResetGameTop').click();
    if (window.roulette && window.roulette.getZoom) currentZoom = window.roulette.getZoom() / 30;
    updateSpeedButtons();
    updateZoomDisplay();
    updateMinimapZoomDisplay();
    if (showProbabilityDefault) updateProbabilityDisplay();
    // Download functionality
    document.querySelector('#btnDownloadTxt').addEventListener('click', downloadAsTxt);
    document.querySelector('#btnDownloadCsv').addEventListener('click', downloadAsCsv);
    document.querySelector('#btnDownloadXls').addEventListener('click', downloadAsXlsx);
}
function simpleToast(msg) {
    const toast = document.createElement('div');
    toast.classList.add('toast');
    toast.innerHTML = msg;
    if (window.translateElement) window.translateElement(toast);
    document.body.appendChild(toast);
    setTimeout(()=>{
        document.body.removeChild(toast);
    }, 1200);
}
// Download functions
function getResultsData() {
    if (!window.roulette || !window.roulette._winners) return [];
    const winners = window.roulette._winners;
    return winners.map((marble, index)=>({
            rank: index + 1,
            name: marble.name
        }));
}
function downloadAsTxt() {
    const results = getResultsData();
    if (results.length === 0) {
        alert('No results to download');
        return;
    }
    const lines = results.map((r)=>`${r.rank}. ${r.name}`);
    const blob = new Blob([
        lines.join('\n')
    ], {
        type: 'text/plain;charset=utf-8'
    });
    downloadBlob(blob, 'marble_results.txt');
}
function downloadAsCsv() {
    const results = getResultsData();
    if (results.length === 0) {
        alert('No results to download');
        return;
    }
    const lines = [
        'Rank,Name'
    ];
    results.forEach((r)=>{
        const name = r.name.includes(',') || r.name.includes('"') ? `"${r.name.replace(/"/g, '""')}"` : r.name;
        lines.push(`${r.rank},${name}`);
    });
    const bom = '\uFEFF';
    const blob = new Blob([
        bom + lines.join('\n')
    ], {
        type: 'text/csv;charset=utf-8'
    });
    downloadBlob(blob, 'marble_results.csv');
}
function downloadAsXlsx() {
    const results = getResultsData();
    if (results.length === 0) {
        alert('No results to download');
        return;
    }
    const xmlHeader = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>';
    const workbookStart = '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
    const workbookEnd = '</Workbook>';
    const worksheetStart = '<Worksheet ss:Name="Results"><Table>';
    const worksheetEnd = '</Table></Worksheet>';
    const headerRow = '<Row><Cell><Data ss:Type="String">Rank</Data></Cell><Cell><Data ss:Type="String">Name</Data></Cell></Row>';
    const dataRows = results.map((r)=>`<Row><Cell><Data ss:Type="Number">${r.rank}</Data></Cell><Cell><Data ss:Type="String">${escapeXml(r.name)}</Data></Cell></Row>`).join('');
    const xml = xmlHeader + workbookStart + worksheetStart + headerRow + dataRows + worksheetEnd + workbookEnd;
    const blob = new Blob([
        xml
    ], {
        type: 'application/vnd.ms-excel;charset=utf-8'
    });
    downloadBlob(blob, 'marble_results.xls');
}
function escapeXml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}
function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

        <select id="settingsMap"></select>
      </div>
      <div class="setting-item toggle-item">
        <label for="settingsAutoRecording">
          <span data-trans="">Auto Recording:</span>
          <input type="checkbox" id="settingsAutoRecording">
        </label>
      </div>
      <div class="setting-item">
        <label data-trans="">Winner Selection:</label>
        <div class="winner-buttons">
          <button id="settingsFirstWinner" class="winner-btn" data-trans="">First</button>
          <button id="settingsLastWinner" class="winner-btn active" data-trans="">Last</button>
          <input type="number" id="settingsWinningRank" value="1" min="1">
        </div>
      </div>
    </div>

    <div class="settings-section">
      <h4 data-trans="">Skill Settings</h4>
      <div class="setting-item toggle-item">
        <label for="settingsEnableSkills">
          <span data-trans="">Enable Skills:</span>
          <input type="checkbox" id="settingsEnableSkills" checked="">
        </label>
      </div>
      <div class="setting-item range-item">
        <label for="settingsSkillCooldown">
          <span data-trans="">Skill Cooldown Time (seconds):</span>
          <span id="settingsSkillCooldownValue">5</span>
        </label>
        <input type="range" id="settingsSkillCooldown" min="1" max="30" step="1" value="5">
      </div>
      <div class="setting-item range-item">
        <label for="settingsSkillProbability">
          <span data-trans="">Skill Probability (%):</span>
          <span id="settingsSkillProbabilityValue">20</span>
        </label>
        <input type="range" id="settingsSkillProbability" min="0" max="100" step="1" value="20">
      </div>
    </div>
  </div>
